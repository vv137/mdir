# A mixture of two types of particles: the parameters of a pair follow from
# those of its particles, which the kernel reads from fields.
#
# RUN: mdir run --overwrite %s | FileCheck %s
# RUN: mdir emit %s | FileCheck %s --check-prefix=MODULE

# The potential energy, the virial, and the pressure at the start agree
# with the sums over all pairs of Inputs/mixture_reference.py:
# -497.729755 kcal/mol, -1117.778154 kcal/mol, and -1712.033551 atm. The
# total energy is conserved.
#
# The initial velocities have 120 K in their kinetic energy. The
# temperature of the log is estimated from the kinetic energies half a
# step before and after as well: 120.002014 K.
#
# CHECK:      MDIR: 256 particles, 200 steps of 0.004 ps
# CHECK:      INFO:      STEP           TIME      TOTAL_ENE  POTENTIAL_ENE    KINETIC_ENE    TEMPERATURE         VIRIAL       PRESSURE
# CHECK-NEXT: INFO:         0         0.0000 {{ *-[0-9.]+}} {{ *}}-497.7298 {{ *[0-9.]+}} {{ *}}120.0020 {{ *}}-1117.7782 {{ *}}-1712.0336
# CHECK-NEXT: INFO:        50         0.2000
# CHECK-NEXT: INFO:       100         0.4000
# CHECK-NEXT: INFO:       150         0.6000
# CHECK-NEXT: INFO:       200         0.8000
# CHECK:      MDIR: the total energy changed by {{[0-9.]+}}e-0{{[5-9]}} of its value

# A parameter that differs between the types is a field, and the kernel
# mixes the values of the two particles.
#
# MODULE:      md.potential @energy(%x: !vec, %cell: !md.cell, %p_epsilon: !real, %p_sigma: !real) -> f64
# MODULE:        md.sum_relation %n, %x, %cell gather(%p_epsilon, %p_sigma : !real, !real)
# MODULE-NEXT:       exchange(symmetric) truncation(switch, from = 7.5{{0*}}e-01)
# MODULE-NEXT:   ^bb0(%r: f64, %d: vector<3xf64>, %epsilon_i: f64, %epsilon_j: f64, %sigma_i: f64, %sigma_j: f64):
# MODULE:          %product_epsilon = arith.mulf %epsilon_i, %epsilon_j : f64
# MODULE-NEXT:     %epsilon = math.sqrt %product_epsilon : f64
# MODULE:          %sum_sigma = arith.addf %sigma_i, %sigma_j : f64
# MODULE:        func.func @mdir_run(
# MODULE-NEXT:       %positions: memref<?x3xf64>, %velocities: memref<?x3xf64>,
# MODULE-NEXT:       %masses: memref<?xf64>, %b_epsilon: memref<?xf64>, %b_sigma: memref<?xf64>,

[input]
coordinates = "Inputs/mixture.pdb"

[energy]
switch_distance = 7.5
cutoff       = 9.0
pairlist_distance = 10.0

[[energy.pair]]
name       = "lj"
expression = "4*epsilon*((sigma/r)^12 - (sigma/r)^6)"
mixing     = "lorentz-berthelot"

[[energy.type]]
name    = "AR"
mass    = 39.95
epsilon = 0.238465
sigma   = 3.4

[[energy.type]]
name    = "KR"
mass    = 83.80
epsilon = 0.3253
sigma   = 3.65

[dynamics]
integrator    = "VELOCITY_VERLET"
time_step     = 0.004
steps         = 200

[ensemble]
ensemble    = "NVE"
temperature = 120.0

[boundary]
type       = "PERIODIC"
box = [23.2, 23.2, 23.2]

[output]
energy_interval = 50
