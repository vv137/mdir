# 1. Minimization: steepest descent from the coordinates of tleap, with the
#    heavy atoms of the peptide held at their places.

[input]
topology    = "ala3.prmtop"
coordinates = "ala3.inpcrd"     # also the reference of the restraints

[output]
checkpoint      = "min.h5"
energy_interval = 500

[energy]
cutoff            = 9.0
pairlist_distance = 10.0
electrostatics    = "PME"
coulomb_modifier  = "POTENTIAL_SHIFT"

[minimize]
method = "STEEPEST_DESCENT"
steps  = 2000

[[restraints]]
selection      = "!:WAT & !@H*"
force_constant = 10.0           # kcal/mol/Å²

[constraints]
hydrogen_bonds = true           # SHAKE and RATTLE on the bonds of hydrogen
rigid_water    = true           # SETTLE on the waters

[boundary]
type = "PERIODIC"

[execution]
target    = "GPU"               # or "CPU", with threads = <n>
precision = "MIXED"
