# 4. Production at constant pressure: 1 ns without restraints, a frame
#    every 1 ps.

[input]
topology    = "ala3.prmtop"
coordinates = "ala3.inpcrd"
checkpoint  = "npt.h5"

[output]
trajectory          = "md.dcd"
checkpoint          = "md.h5"
energy_interval     = 5000
trajectory_interval = 500
checkpoint_interval = 50000

[energy]
cutoff            = 9.0
pairlist_distance = 10.0
electrostatics    = "PME"
coulomb_modifier  = "POTENTIAL_SHIFT"

[dynamics]
integrator = "VELOCITY_VERLET"
time_step  = 0.002
steps      = 500000

[ensemble]
ensemble    = "NPT"
temperature = 300.0
pressure    = 1.0

[thermostat]
method        = "V-RESCALE"     # stochastic velocity rescaling
time_constant = 0.5             # ps
interval      = 10              # steps

[barostat]
method        = "C-RESCALE"     # stochastic cell rescaling
time_constant = 2.0             # ps

[constraints]
hydrogen_bonds = true           # SHAKE and RATTLE on the bonds of hydrogen
rigid_water    = true           # SETTLE on the waters

[boundary]
type = "PERIODIC"

[execution]
target    = "GPU"               # or "CPU", with threads = <n>
precision = "MIXED"
