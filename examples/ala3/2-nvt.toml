# 2. Heating at constant volume: velocities drawn at 300 K, stochastic
#    velocity rescaling, 50 ps with the heavy atoms of the peptide
#    restrained.

[input]
topology    = "ala3.prmtop"
coordinates = "ala3.inpcrd"
checkpoint  = "min.h5"          # begins at the minimized positions

[output]
checkpoint          = "nvt.h5"
energy_interval     = 2500
checkpoint_interval = 25000

[energy]
cutoff            = 9.0
pairlist_distance = 10.0
electrostatics    = "PME"
coulomb_modifier  = "POTENTIAL_SHIFT"

[dynamics]
integrator = "VELOCITY_VERLET"  # or "LEAPFROG"; each stage must use the same
time_step  = 0.002              # ps
steps      = 25000

[ensemble]
ensemble    = "NVT"
temperature = 300.0

[thermostat]
method        = "V-RESCALE"     # stochastic velocity rescaling
time_constant = 0.5             # ps
interval      = 10              # steps

[[restraints]]
selection      = "!:WAT & !@H*"
force_constant = 10.0

[constraints]
hydrogen_bonds = true           # SHAKE and RATTLE on the bonds of hydrogen
rigid_water    = true           # SETTLE on the waters

[boundary]
type = "PERIODIC"

[execution]
target    = "GPU"               # or "CPU", with threads = <n>
precision = "MIXED"
