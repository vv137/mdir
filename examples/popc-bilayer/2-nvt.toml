# 2. Equilibration at constant volume: velocities drawn at 303 K, 100 ps
#    of 1 fs with stochastic velocity rescaling, the phosphorus atoms
#    restrained. The packing leaves gaps that the next stage closes.

[input]
topology    = "popc.prmtop"
coordinates = "popc.inpcrd"
checkpoint  = "min.h5"          # begins at the minimized positions

[output]
energy_interval     = 1000
trajectory          = "nvt.dcd"
trajectory_interval = 2000
checkpoint          = "nvt.h5"
checkpoint_interval = 100000

[energy]
cutoff            = 10.0
pairlist_distance = 13.0        # the outer list of the groups, Å
pruned_distance   = 10.6        # the inner list pruned from it, Å
electrostatics    = "PME"

[pme]
tolerance   = 1e-05
max_spacing = 1.0

[dynamics]
integrator = "VELOCITY_VERLET"
time_step  = 0.001              # ps
steps      = 100000

[ensemble]
ensemble    = "NVT"
temperature = 303.0

[thermostat]
method        = "V-RESCALE"     # stochastic velocity rescaling
time_constant = 1.0             # ps
interval      = 25              # steps

[[restraints]]
selection      = ":PC@P31"
force_constant = 10.0

[constraints]
hydrogen_bonds = true
rigid_water    = true

[boundary]
type = "PERIODIC"

[execution]
target    = "GPU"
precision = "MIXED"
neighbor_structure = "GROUPS"   # groups of 16 with a dual list (GPU only)
