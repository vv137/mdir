# 2. Relaxation: velocities drawn at 303 K, 100 ps of 1 fs at 1 bar with
#    semi-isotropic coupling. The water and the lipids close the gaps that
#    packmol left, and the cell shrinks by about a sixth of its volume.

[input]
topology    = "popc.prmtop"
coordinates = "popc.inpcrd"
checkpoint  = "min.h5"          # begins at the minimized positions

[output]
energy_interval     = 1000
trajectory          = "relax.dcd"
trajectory_interval = 2000
checkpoint          = "relax.h5"
checkpoint_interval = 100000

[energy]
cutoff            = 10.0
pairlist_distance = 13.0        # the outer list of the groups, Å
pruned_distance   = 10.6        # the inner list pruned from it, Å
electrostatics    = "PME"

[pme]
tolerance   = 1e-05
max_spacing = 1.0

[dynamics]
integrator = "VELOCITY_VERLET"
time_step  = 0.001              # ps
steps      = 100000

[ensemble]
ensemble    = "NPT"
temperature = 303.0
pressure    = 0.986923          # atm, 1 bar

[thermostat]
method        = "V-RESCALE"     # stochastic velocity rescaling
time_constant = 1.0             # ps
interval      = 25              # steps

[barostat]
method        = "C-RESCALE"     # stochastic cell rescaling
time_constant = 5.0             # ps
interval      = 25              # that of the thermostat
coupling      = "SEMI_ISOTROPIC" # the area (x, y) and the height (z) apart

[constraints]
hydrogen_bonds = true
rigid_water    = true

[boundary]
type = "PERIODIC"

[execution]
target    = "GPU"
precision = "MIXED"
neighbor_structure = "GROUPS"   # groups of 16 with a dual list (GPU only)
