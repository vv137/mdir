# 3. Equilibration at constant pressure: 500 ps of 1 fs at 1 bar with
#    semi-isotropic coupling and weaker restraints. The water and the
#    lipids close the gaps of the packing, and the cell loses about a sixth
#    of its volume, most of it in the first 50 ps.

[input]
topology    = "popc.prmtop"
coordinates = "popc.inpcrd"
checkpoint  = "nvt.h5"

[output]
energy_interval     = 5000
trajectory          = "npt.dcd"
trajectory_interval = 5000
checkpoint          = "npt.h5"
checkpoint_interval = 500000

[energy]
cutoff            = 10.0
pairlist_distance = 13.0        # the outer list of the groups, Å
pruned_distance   = 10.6        # the inner list pruned from it, Å
electrostatics    = "PME"

[pme]
tolerance   = 1e-05
max_spacing = 1.0

[dynamics]
integrator = "VELOCITY_VERLET"
time_step  = 0.001              # ps
steps      = 500000

[ensemble]
ensemble    = "NPT"
temperature = 303.0
pressure    = 0.986923          # atm, 1 bar

[thermostat]
method        = "V-RESCALE"     # stochastic velocity rescaling
time_constant = 1.0             # ps
interval      = 25              # steps

[barostat]
method        = "C-RESCALE"     # stochastic cell rescaling
time_constant = 5.0             # ps
interval      = 25              # that of the thermostat
coupling      = "SEMI_ISOTROPIC" # the area (x, y) and the height (z) apart

[[restraints]]
selection         = ":PC@P31"
force_constant    = 1.0
reference_scaling = "ALL"       # spread through the cell, they follow it

[constraints]
hydrogen_bonds = true
rigid_water    = true

[boundary]
type = "PERIODIC"

[execution]
target    = "GPU"
precision = "MIXED"
neighbor_structure = "GROUPS"   # groups of 16 with a dual list (GPU only)
