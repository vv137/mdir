# 2. Heating at constant volume: velocities drawn at 300 K, stochastic
#    velocity rescaling, 100 ps with the heavy atoms of the protein
#    restrained.

[input]
topology    = "ubq.prmtop"
coordinates = "ubq.inpcrd"
checkpoint  = "min.h5"          # begins at the minimized positions

[output]
checkpoint          = "nvt.h5"
energy_interval     = 5000
checkpoint_interval = 50000

[energy]
cutoff            = 9.0
pairlist_distance = 12.0        # the outer list of the groups, Å
pruned_distance   = 9.6         # the inner list pruned from it, Å
electrostatics    = "PME"

[pme]
tolerance   = 1e-05
max_spacing = 1.0

[dynamics]
integrator = "VELOCITY_VERLET"
time_step  = 0.002              # ps
steps      = 50000

[ensemble]
ensemble    = "NVT"
temperature = 300.0

[thermostat]
method        = "V-RESCALE"     # stochastic velocity rescaling
time_constant = 1.0             # ps
interval      = 25              # steps

[[restraints]]
selection      = "!:WAT & !@H*"
force_constant = 10.0

[constraints]
hydrogen_bonds = true
rigid_water    = true

[boundary]
type = "PERIODIC"

[execution]
target    = "GPU"
precision = "MIXED"
neighbor_structure = "GROUPS"   # groups of 16 with a dual list (GPU only)
