# 4. Production at constant pressure: 10 ns without restraints, a frame
#    every 10 ps.

[input]
topology    = "ubq.prmtop"
coordinates = "ubq.inpcrd"
checkpoint  = "npt.h5"

[output]
trajectory          = "md.dcd"
checkpoint          = "md.h5"
energy_interval     = 5000
trajectory_interval = 5000
checkpoint_interval = 500000

[energy]
cutoff            = 9.0
pairlist_distance = 12.0        # the outer list of the groups, Å
pruned_distance   = 9.6         # the inner list pruned from it, Å
electrostatics    = "PME"

[pme]
tolerance   = 1e-05
max_spacing = 1.0

[dynamics]
integrator = "VELOCITY_VERLET"
time_step  = 0.002              # ps
steps      = 5000000

[ensemble]
ensemble    = "NPT"
temperature = 300.0
pressure    = 0.986923          # atm, 1 bar

[thermostat]
method        = "V-RESCALE"     # stochastic velocity rescaling
time_constant = 1.0             # ps
interval      = 25              # steps

[barostat]
method        = "C-RESCALE"     # stochastic cell rescaling
time_constant = 2.0             # ps
interval      = 25              # that of the thermostat

[constraints]
hydrogen_bonds = true
rigid_water    = true

[boundary]
type = "PERIODIC"

[execution]
target    = "GPU"
precision = "MIXED"
neighbor_structure = "GROUPS"   # groups of 16 with a dual list (GPU only)
