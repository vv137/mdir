# 4. Production at constant volume in the cell of stage 3, at
#    sigma' = @SIGMA@ Å, without restraints. The walls stand at L_z/4 and
#    3 L_z/4 of that cell and the slab at its middle. A row of the walls,
#    the slab, and the two derivatives of the correction every 0.2 ps.

[input]
topology    = "../system.prmtop"
coordinates = "../system.inpcrd"
checkpoint  = "@START@"

[output]
log                 = "@NAME@.log"
observables         = "@NAME@.obs"
checkpoint          = "@NAME@.h5"
energy_interval     = 100
checkpoint_interval = @STEPS@

[dynamics]
integrator = "VELOCITY_VERLET"
time_step  = 0.002
steps      = @STEPS@
seed       = @SEED@

[ensemble]
ensemble    = "NVT"
temperature = 300.0

[thermostat]
method   = "LANGEVIN"
friction = 1.0

[energy]
cutoff                 = 9.0
electrostatics         = "PME"
coulomb_modifier       = "POTENTIAL_SHIFT"
lennard_jones_modifier = "NONE"
dispersion_correction  = "ENERGY_PRESSURE"

# The K-Cl correction, linear in x12 and x6: the pair has C12 (1 + x12) and
# C6 (1 + x6) of the Lorentz-Berthelot pair of the Joung-Cheatham ions,
# c12 = 4 eps0 sig0^12 and c6 = 4 eps0 sig0^6 with sig0 = 3.757811 Å and
# eps0 = 0.0830263 kcal/mol. run.py sets x12 and x6 from sigma'.
[[energy.pair]]
name       = "nbfix"
groups     = [":K+", ":Cl-"]
expression = "x12*c12/r^12 - x6*c6/r^6"
@OBSERVE_NBFIX@
c12 = 2633265.4421778
c6  = 935.15840794972
x12 = @X12@
x6  = @X6@

# Flat-bottom walls on the ions alone (Luo and Roux 2010): the osmotic
# pressure is (lower.d_z0 - upper.d_z0) / (2 A) for the area A of the cell.
[[energy.external]]
name       = "lower"
selection  = ":K+,Cl-"
scaling    = "@SCALING@"
expression = "0.5*k*max(0, z0 - z)^2"
@OBSERVE_WALL@
k  = 10.0
z0 = @ZLO@

[[energy.external]]
name       = "upper"
selection  = ":K+,Cl-"
scaling    = "@SCALING@"
expression = "0.5*k*max(0, z - z0)^2"
@OBSERVE_WALL@
k  = 10.0
z0 = @ZHI@

# A term of zero strength whose derivative counts the ions in the slab
# |z - zc| < zw, the bulk of the solution: its concentration.
[[energy.external]]
name       = "slab"
selection  = ":K+,Cl-"
scaling    = "@SCALING@"
expression = "s*step(zw - abs(z - zc))"
@OBSERVE_SLAB@
s  = 0.0
zc = @ZC@
zw = 10.0

[constraints]
hydrogen_bonds = true
rigid_water    = true

[boundary]
type = "PERIODIC"

[execution]
target    = "@TARGET@"
precision = "MIXED"
@THREADS@
