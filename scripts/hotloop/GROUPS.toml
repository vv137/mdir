[input]
topology   = "opc.prmtop"
coordinates = "opc.inpcrd"

[output]
energy_interval = 50
[energy]
cutoff        = 9.0
pairlist_distance = 11.0
pruned_distance = 9.3
electrostatics = "PME"
coulomb_modifier     = "POTENTIAL_SHIFT"

[dynamics]
integrator    = "VELOCITY_VERLET"
time_step     = 0.001
steps         = 100

[ensemble]
ensemble    = "NVE"
temperature = 300.0

[constraints]
rigid_water = true

[boundary]
type = "PERIODIC"
[execution]
target = "gpu"
precision = "mixed"
neighbor_structure = "GROUPS"
